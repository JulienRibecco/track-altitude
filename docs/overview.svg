  <g id="text_14">
   <text style="fill: #eee8dc; font: 700 25px 'DejaVu Sans'; text-anchor: start" x="59.4" y="48.6" transform="rotate(-0 59.4 48.6)">From race archive to an inspectable result</text>
  </g>
  <g id="text_15">
   <text style="fill: #b5bdae; font: 11px 'DejaVu Sans'; text-anchor: start" x="59.4" y="78.408" transform="rotate(-0 59.4 78.408)">TRACK ALTITUDE  /  DATA PIPELINE &amp; EVALUATION AUDIT</text>
  </g>
  <g id="text_16">
   <text style="fill: #d69170; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="74.52" y="138.672" transform="rotate(-0 74.52 138.672)">01  INGEST</text>
  </g>
  <g id="text_17">
   <text style="fill: #eee8dc; font: 25px 'DejaVu Sans'; text-anchor: start" x="74.52" y="174.96" transform="rotate(-0 74.52 174.96)">170,814</text>
  </g>
  <g id="text_18">
   <text style="fill: #eee8dc; font: 10px 'DejaVu Sans'; text-anchor: start" x="74.52" y="196.992" transform="rotate(-0 74.52 196.992)">outdoor race records</text>
  </g>
  <g id="text_19">
   <text style="fill: #b5bdae; font: 9px 'DejaVu Sans'; text-anchor: start" x="74.52" y="219.672" transform="rotate(-0 74.52 219.672)">16 source CSVs</text>
  </g>
  <g id="text_20">
   <text style="fill: #d69170; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="328.32" y="138.672" transform="rotate(-0 328.32 138.672)">02  ENRICH</text>
  </g>
  <g id="text_21">
   <text style="fill: #eee8dc; font: 25px 'DejaVu Sans'; text-anchor: start" x="328.32" y="174.96" transform="rotate(-0 328.32 174.96)">96,294</text>
  </g>
  <g id="text_22">
   <text style="fill: #eee8dc; font: 10px 'DejaVu Sans'; text-anchor: start" x="328.32" y="196.992" transform="rotate(-0 328.32 196.992)">enriched outdoor records</text>
  </g>
  <g id="text_23">
   <text style="fill: #b5bdae; font: 9px 'DejaVu Sans'; text-anchor: start" x="328.32" y="219.672" transform="rotate(-0 328.32 219.672)">Venues + athlete proxies</text>
  </g>
  <g id="text_24">
   <text style="fill: #d69170; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="582.12" y="138.672" transform="rotate(-0 582.12 138.672)">03  BUILD FEATURES</text>
  </g>
  <g id="text_25">
   <text style="fill: #eee8dc; font: 25px 'DejaVu Sans'; text-anchor: start" x="582.12" y="174.96" transform="rotate(-0 582.12 174.96)">93,990</text>
  </g>
  <g id="text_26">
   <text style="fill: #eee8dc; font: 10px 'DejaVu Sans'; text-anchor: start" x="582.12" y="196.992" transform="rotate(-0 582.12 196.992)">eligible performances</text>
  </g>
  <g id="text_27">
   <text style="fill: #b5bdae; font: 9px 'DejaVu Sans'; text-anchor: start" x="582.12" y="219.672" transform="rotate(-0 582.12 219.672)">Past-only race history</text>
  </g>
  <g id="text_28">
   <text style="fill: #96bac8; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="835.92" y="138.672" transform="rotate(-0 835.92 138.672)">04  EVALUATE</text>
  </g>
  <g id="text_29">
   <text style="fill: #eee8dc; font: 25px 'DejaVu Sans'; text-anchor: start" x="835.92" y="174.96" transform="rotate(-0 835.92 174.96)">89,153</text>
  </g>
  <g id="text_30">
   <text style="fill: #eee8dc; font: 10px 'DejaVu Sans'; text-anchor: start" x="835.92" y="196.992" transform="rotate(-0 835.92 196.992)">held-out race predictions</text>
  </g>
  <g id="text_31">
   <text style="fill: #b5bdae; font: 9px 'DejaVu Sans'; text-anchor: start" x="835.92" y="219.672" transform="rotate(-0 835.92 219.672)">Five future-date blocks</text>
  </g>
  <g id="text_32">
   <text style="fill: #b5bdae; font: 11px 'DejaVu Sans'; text-anchor: start" x="59.4" y="263.736" transform="rotate(-0 59.4 263.736)">Shared dates stay together. Preprocessing fits on training rows only.</text>
  </g>
  <g id="text_33">
   <text style="fill: #eee8dc; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="59.4" y="308.448" transform="rotate(-0 59.4 308.448)">Does altitude improve future-race prediction?</text>
  </g>
  <g id="text_34">
   <text style="fill: #b5bdae; font: 10px 'DejaVu Sans'; text-anchor: start" x="59.4" y="331.776" transform="rotate(-0 59.4 331.776)">Reduction in log-time squared error vs. personal-best + race-context baseline</text>
  </g>
  <g id="text_35">
   <text style="fill: #d69170; font: 10px 'DejaVu Sans'; text-anchor: start" x="162" y="557.28" transform="rotate(-0 162 557.28)">← Worse prediction</text>
  </g>
  <g id="text_36">
   <text style="fill: #96bac8; font: 10px 'DejaVu Sans'; text-anchor: start" x="496.8" y="557.28" transform="rotate(-0 496.8 557.28)">Better prediction →</text>
  </g>
  <g id="text_37">
   <text style="fill: #96bac8; font: 45px 'DejaVu Sans'; text-anchor: start" x="734.4" y="388.152" transform="rotate(-0 734.4 388.152)">0.63%</text>
  </g>
  <g id="text_38">
   <text style="fill: #eee8dc; font: 12px 'DejaVu Sans'; text-anchor: start" x="736.56" y="421.2" transform="rotate(-0 736.56 421.2)">lower pooled held-out squared error</text>
  </g>
  <g id="text_39">
   <text style="fill: #b5bdae; font: 11px 'DejaVu Sans'; text-anchor: start" x="736.56" y="451.656" transform="rotate(-0 736.56 451.656)">Four of five folds improve.</text>
  </g>
  <g id="text_40">
   <text style="fill: #b5bdae; font: 11px 'DejaVu Sans'; text-anchor: start" x="736.56" y="472.392" transform="rotate(-0 736.56 472.392)">The earliest fold worsens.</text>
  </g>
  <g id="text_41">
   <text style="fill: #eee8dc; font: 11px 'DejaVu Sans'; text-anchor: start" x="736.56" y="509.328" transform="rotate(-0 736.56 509.328)">16/16 source files matched on rebuild.</text>
  </g>
  <g id="text_42">
   <text style="fill: #b5bdae; font: 10px 'DejaVu Sans'; text-anchor: start" x="736.56" y="530.064" transform="rotate(-0 736.56 530.064)">Saved audit results reproduced exactly.*</text>
  </g>
  <g id="text_43">
   <text style="fill: #eee8dc; font: 10px 'DejaVu Sans'; text-anchor: start" x="59.4" y="597.456" transform="rotate(-0 59.4 597.456)">Prediction-error reduction, not a change in race time or a causal effect. Exploratory; no confidence interval.</text>
  </g>
  <g id="text_44">
   <text style="fill: #b5bdae; font: 9px 'DejaVu Sans'; text-anchor: start" x="59.4" y="620.136" transform="rotate(-0 59.4 620.136)">*Reuses the existing venue table, retrospective mass cache and software environment. Source: saved audit and rebuild reports.</text>
  </g>
